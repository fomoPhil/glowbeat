<!doctype html>
<html lang="en" class="t-dark"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Glowbeat Party Mode - Type Specimens</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@300..600&family=Inter:wght@300..700&family=Inter+Tight:wght@400..700&family=JetBrains+Mono:wght@400..600&family=Space+Grotesk:wght@400..700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   TYPE SPECIMENS - the same Party Mode excerpt, six pairings.
   Tokens, geometry and components lifted from 05-minimal.html.
   Theme tokens live on classes, not on :root, so one card can
   show dark and light side by side.
   ============================================================ */

.t-dark{
  --void:      #0d0d0f;
  --win:       #1a1a1e;
  --win-hi:    #202026;
  --trough:    rgba(255,255,255,.055);
  --raise:     #33333b;

  --fg1: #f3f3f6;
  --fg2: #a0a0a9;
  --fg3: #7b7b84;

  --accent:      #ffb43c;
  --accent-glow: rgba(255,180,60,.30);

  --hair: rgba(255,255,255,.075);

  --glass-fill: rgba(255,255,255,.055);
  --glass-edge: inset 0 1px 0 rgba(255,255,255,.14),
                inset 0 0 0 1px rgba(255,255,255,.055);
  --glass-drop: 0 1px 1px rgba(0,0,0,.30),
                0 8px 24px -10px rgba(0,0,0,.55),
                0 24px 60px -30px rgba(0,0,0,.70);

  --lift:     0 0 0 1px rgba(255,255,255,.09),
              0 1px 2px rgba(0,0,0,.34);

  --win-drop: 0 0 0 1px rgba(255,255,255,.06),
              0 2px 6px rgba(0,0,0,.30),
              0 24px 50px -18px rgba(0,0,0,.60),
              0 60px 120px -50px rgba(0,0,0,.85);

  --thumb: #c9c9d3;

  --meter-off: rgba(255,255,255,.085);
  --meter-on:  rgba(243,243,246,.38);
  --meter-pk:  rgba(243,243,246,.18);

  --ambient-a: rgba(140,110,255,.16);
  --ambient-b: rgba(255,180,60,.10);

  --card: rgba(255,255,255,.028);
  --card-edge: rgba(255,255,255,.07);
}

.t-light{
  --void:      #e4e4e8;
  --win:       #f1f1f5;
  --win-hi:    #f8f8fb;
  --trough:    rgba(0,0,0,.055);
  --raise:     #ffffff;

  --fg1: #17171a;
  --fg2: #5e5e67;
  --fg3: #86868f;

  --accent:      #a25e00;
  --accent-glow: rgba(162,94,0,.22);

  --hair: rgba(0,0,0,.085);

  --glass-fill: rgba(255,255,255,.80);
  --glass-edge: inset 0 1px 0 rgba(255,255,255,.90),
                inset 0 0 0 1px rgba(0,0,0,.055);
  --glass-drop: 0 1px 1px rgba(0,0,0,.05),
                0 8px 20px -8px rgba(0,0,0,.16),
                0 22px 44px -24px rgba(0,0,0,.24);

  --lift:     0 0 0 1px rgba(0,0,0,.06),
              0 1px 2px -1px rgba(0,0,0,.10),
              0 2px 4px rgba(0,0,0,.05);

  --win-drop: 0 0 0 1px rgba(0,0,0,.07),
              0 2px 5px rgba(0,0,0,.05),
              0 20px 40px -16px rgba(0,0,0,.14),
              0 50px 100px -46px rgba(0,0,0,.22);

  --thumb: #ffffff;

  --meter-off: rgba(0,0,0,.075);
  --meter-on:  rgba(23,23,26,.34);
  --meter-pk:  rgba(23,23,26,.17);

  --ambient-a: rgba(120,90,230,.14);
  --ambient-b: rgba(255,160,40,.16);

  --card: rgba(255,255,255,.55);
  --card-edge: rgba(0,0,0,.07);
}

:root{
  --sys:  -apple-system, BlinkMacSystemFont, system-ui, "Helvetica Neue", Helvetica, Arial, sans-serif;
  --sysmono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, monospace;
  --ease: cubic-bezier(.2,0,0,1);
  --quick: 150ms;
  --calm: 240ms;
}

/* ---------- the six pairings ---------- */
.fp1{ --f-title:var(--sys); --f-ui:var(--sys); --f-seg:var(--sys); --f-num:var(--sysmono); }

.fp2{ --f-title:"SF Pro Rounded", ui-rounded, -apple-system, system-ui, sans-serif;
      --f-ui:var(--sys);
      --f-seg:"SF Pro Rounded", ui-rounded, -apple-system, system-ui, sans-serif;
      --f-num:var(--sysmono); }

.fp3{ --f-title:"Geist", var(--sys); --f-ui:"Geist", var(--sys); --f-seg:"Geist", var(--sys);
      --f-num:"Geist Mono", var(--sysmono); }

.fp4{ --f-title:"Inter Tight", var(--sys); --f-ui:"Inter", var(--sys); --f-seg:"Inter", var(--sys);
      --f-num:"JetBrains Mono", var(--sysmono); }

.fp5{ --f-title:"Space Grotesk", var(--sys); --f-ui:var(--sys); --f-seg:var(--sys);
      --f-num:"Space Mono", var(--sysmono); }

.fp6{ --f-title:ui-serif, "New York", "Iowan Old Style", Georgia, serif;
      --f-ui:var(--sys); --f-seg:var(--sys); --f-num:var(--sysmono); }

/* per-pairing optical corrections */
.fp4 .title{letter-spacing:-.026em}
.fp5 .title{letter-spacing:-.018em;font-weight:600}
.fp6 .title{letter-spacing:-.008em;font-weight:600;font-size:22px}
.fp3 .hero-value,.fp4 .hero-value,.fp5 .hero-value{font-size:27px;letter-spacing:-.02em}
.fp3 .value,.fp4 .value,.fp5 .value{font-size:12.5px}

/* ============================================================
   PAGE
   ============================================================ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  background:var(--void);
  color-scheme:dark;
}
html.t-light{color-scheme:light}
body{
  min-height:100vh;
  background:var(--void);
  color:var(--fg1);
  font-family:var(--sys);
  font-size:13px;line-height:1.45;
  letter-spacing:-.003em;
  padding:30px 26px 70px;
}
.wrap{max-width:1560px;margin:0 auto}

/* ---------- masthead ---------- */
.mast{display:flex;align-items:flex-end;gap:26px;flex-wrap:wrap;margin-bottom:16px}
.mast h1{font-size:19px;font-weight:620;letter-spacing:-.018em;line-height:1.2}
.mast p{font-size:12px;color:var(--fg2);max-width:52ch;margin-top:4px;text-wrap:pretty}
.mast .sp{flex:1}

/* ---------- verdict ---------- */
.verdict{
  display:flex;align-items:flex-start;gap:12px;
  padding:13px 16px 13px 14px;margin:0 0 22px;
  border-radius:12px;
  background:var(--card);
  box-shadow:0 0 0 1px var(--card-edge);
}
.verdict .rule{flex:none;width:3px;align-self:stretch;border-radius:2px;background:var(--accent);
  box-shadow:0 0 14px -2px var(--accent-glow)}
.verdict p{font-size:13.5px;line-height:1.5;text-wrap:pretty;max-width:96ch}
.verdict b{font-weight:620;color:var(--accent)}

/* ---------- controls ---------- */
.controls{display:flex;align-items:center;gap:10px}
.controls .cap{font-size:11.5px;color:var(--fg3)}
.modes{display:inline-flex;gap:2px;padding:3px;border-radius:11px;background:var(--trough)}
.mode{
  appearance:none;border:0;background:transparent;cursor:pointer;font:inherit;
  font-size:12.5px;color:var(--fg2);height:30px;padding:0 13px;border-radius:8px;
  transition:background-color var(--quick) var(--ease),color var(--quick) var(--ease);
}
.mode:hover{color:var(--fg1)}
.mode:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mode[aria-pressed="true"]{background:var(--raise);color:var(--accent);font-weight:590;box-shadow:var(--lift)}

/* ---------- grid of specimens ---------- */
.grid{display:grid;gap:22px;grid-template-columns:repeat(auto-fit,minmax(404px,1fr));align-items:start}
.grid.both{grid-template-columns:repeat(auto-fit,minmax(840px,1fr))}
@media (max-width:460px){ .grid,.grid.both{grid-template-columns:1fr} }

.card{
  padding:16px 16px 18px;border-radius:18px;
  background:var(--card);
  box-shadow:0 0 0 1px var(--card-edge);
}
.card-head{display:flex;align-items:baseline;gap:10px;margin-bottom:13px;padding:0 3px}
.card-name{font-size:13.5px;font-weight:590;letter-spacing:-.008em;color:var(--fg1)}
.card-head .sp{flex:1}
.idx{font-size:11.5px;color:var(--fg3);font-variant-numeric:tabular-nums}
.badge{
  font-size:11px;font-weight:590;line-height:1;padding:5px 9px;border-radius:7px;
  background:var(--accent);color:#1a1200;letter-spacing:-.005em;
}
html.t-light .badge{color:#fff8ee}

.stages{display:grid;gap:14px;grid-template-columns:1fr}
.both .stages{grid-template-columns:1fr 1fr}
.stage-cap{font-size:11px;color:var(--fg3);margin:0 0 6px 4px}

.note{font-size:12px;line-height:1.5;color:var(--fg2);margin-top:12px;padding:0 3px;text-wrap:pretty;max-width:74ch}
.note + .note{margin-top:4px}
.note b{color:var(--fg1);font-weight:590}
.status{color:var(--fg3)}
.status.warn{color:var(--accent)}

/* ============================================================
   THE PANEL EXCERPT - geometry from 05-minimal
   ============================================================ */
.panel{
  position:relative;isolation:isolate;overflow:hidden;
  background:linear-gradient(180deg,var(--win-hi) 0%,var(--win) 34%);
  border-radius:16px;
  box-shadow:var(--win-drop);
  padding:20px 22px 20px;
  font-family:var(--f-ui);
  color:var(--fg1);
}
.panel::before{
  content:"";position:absolute;z-index:-1;left:-16%;right:-16%;top:-190px;height:600px;
  background:
    radial-gradient(48% 50% at 28% 62%, var(--ambient-a) 0%, transparent 100%),
    radial-gradient(44% 46% at 76% 52%, var(--ambient-b) 0%, transparent 100%);
  pointer-events:none;
}

.title{font-family:var(--f-title);color:var(--fg1);font-size:21px;font-weight:640;letter-spacing:-.021em;line-height:1.14}
.section-title{font-size:13px;font-weight:590;letter-spacing:-.005em;color:var(--fg1)}
.label{font-size:13px;font-weight:400;color:var(--fg1)}
.caption{font-size:12px;line-height:1.46;color:var(--fg2);text-wrap:pretty;max-width:60ch}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}

.section{padding:22px 2px 0}
.section-head{margin-bottom:11px}
.sub{margin-top:10px}

.hdr{display:flex;align-items:center;gap:16px;padding:0 2px}
.hdr .sp{flex:1}

.switch{position:relative;display:inline-flex;flex:none;cursor:pointer}
.switch input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.switch .track{
  width:46px;height:28px;padding:3px;border-radius:10px;
  background:var(--trough);box-shadow:var(--lift);display:block;
  transition-property:background-color,box-shadow;
  transition-duration:var(--calm);transition-timing-function:var(--ease);
}
.switch .knob{
  display:block;width:22px;height:22px;border-radius:7px;background:var(--fg1);
  box-shadow:0 1px 2px rgba(0,0,0,.30),0 0 0 .5px rgba(0,0,0,.12);
  transform:translateX(0);
  transition-property:transform,background-color,scale;
  transition-duration:var(--calm);transition-timing-function:var(--ease);
}
.switch input:checked + .track{
  background:var(--accent);
  box-shadow:0 0 0 1px rgba(0,0,0,.12) inset, 0 0 16px -4px var(--accent-glow);
}
.switch input:checked + .track .knob{transform:translateX(18px);background:#fff}
.switch:active .knob{transition-duration:100ms;scale:.96}
.switch input:focus-visible + .track{outline:2px solid var(--accent);outline-offset:3px}

.hero{margin-top:18px}
.glass{
  position:relative;padding:15px;border-radius:24px;
  background:var(--glass-fill);
  -webkit-backdrop-filter:blur(30px) saturate(180%);
  backdrop-filter:blur(30px) saturate(180%);
  box-shadow:var(--glass-edge),var(--glass-drop);
}
.hero-head{display:flex;align-items:baseline;justify-content:space-between;gap:16px;
  padding:0 2px;margin-bottom:18px}
.hero-head .section-title{font-size:15px;font-weight:620;letter-spacing:-.012em}
.hero-value{font-size:30px;font-weight:620;letter-spacing:-.024em;line-height:1;color:var(--fg1)}

.meter-block{padding:0 2px}
.meter-wrap{position:relative;padding-bottom:22px}
.meter{position:relative;display:flex;gap:2px;height:28px;border-radius:8px;align-items:stretch}
.meter-seg{flex:1;border-radius:1.5px;background:var(--meter-off)}
.meter-lit{
  position:absolute;inset:0;display:flex;gap:2px;align-items:stretch;
  clip-path:inset(0 31% 0 0);
}
.meter-lit .meter-seg{background:var(--meter-on)}
.meter-lit .meter-seg.pk{background:var(--meter-pk)}

.marker{
  position:absolute;top:-6px;height:40px;width:3px;margin-left:-1.5px;
  border-radius:2px;background:var(--accent);
  box-shadow:0 0 14px -2px var(--accent-glow);cursor:ew-resize;
}
.marker .grip{
  position:absolute;left:50%;top:100%;margin-top:-2px;transform:translateX(-50%);
  width:26px;height:11px;border-radius:4px;background:var(--accent);
  box-shadow:0 1px 2px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.35);
}
.marker:focus-visible{outline:2px solid var(--accent);outline-offset:4px;border-radius:3px}

.segmented{
  display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:2px;
  padding:3px;border-radius:11px;background:var(--trough);
}
.seg{
  position:relative;appearance:none;border:0;background:transparent;cursor:pointer;
  font-family:var(--f-seg);font-size:13px;font-weight:400;color:var(--fg2);
  height:34px;border-radius:8px;
  transition-property:background-color,color,box-shadow,scale;
  transition-duration:var(--quick);transition-timing-function:var(--ease);
}
.seg:hover{color:var(--fg1)}
.seg:active{transition-duration:100ms;scale:.96}
.seg:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.seg[aria-checked="true"]{background:var(--raise);color:var(--accent);font-weight:590;box-shadow:var(--lift)}

.row{display:flex;align-items:center;gap:14px;min-height:40px}
.row > .label{flex:none;width:64px}
.row > .value{flex:none;min-width:84px;text-align:right;font-size:13px;color:var(--fg1)}
.row > .value .unit{color:var(--fg2);font-weight:400;margin-left:4px}

.slider{flex:1;position:relative;height:40px;display:flex;align-items:center}
.strack{position:relative;height:4px;border-radius:2px;background:var(--trough);width:100%;
  box-shadow:inset 0 0 0 .5px rgba(128,128,140,.16)}
.fill{position:absolute;left:0;top:0;bottom:0;border-radius:2px;background:var(--accent)}
.thumb{
  position:absolute;top:50%;width:22px;height:22px;margin-top:-11px;border-radius:7px;
  left:calc(var(--p) * (100% - 22px) / 100);
  background:var(--thumb);
  box-shadow:0 0 0 .5px rgba(0,0,0,.18),0 1px 3px rgba(0,0,0,.30),
             inset 0 1px 0 rgba(255,255,255,.22);
  cursor:ew-resize;
  transition-property:scale,box-shadow;
  transition-duration:var(--quick);transition-timing-function:var(--ease);
}
.thumb:active{transition-duration:100ms;scale:.96}
.thumb:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition-duration:.01ms !important;animation:none !important}
}
@media (max-width:620px){
  body{padding:22px 14px 50px}
  .panel{padding:16px 16px 16px}
}
</style></head>

<body>
<div class="wrap">

  <div class="mast">
    <div>
      <h1>Party Mode type specimens</h1>
      <p>The same excerpt six times. Judge the title, the preset names, and the live numbers.</p>
    </div>
    <span class="sp"></span>
    <div class="controls">
      <span class="cap">View</span>
      <div class="modes" id="modes">
        <button class="mode" type="button" data-mode="dark">Dark</button>
        <button class="mode" type="button" data-mode="light">Light</button>
        <button class="mode" type="button" data-mode="system">System</button>
        <button class="mode" type="button" data-mode="both">Both</button>
      </div>
    </div>
  </div>

  <div class="verdict">
    <span class="rule"></span>
    <p id="verdict-text"></p>
  </div>

  <div class="grid" id="grid"></div>

</div>

<script>
/* ---------------- data ---------------- */
const PAIRINGS = [
  { cls:'fp1', name:'SF Pro Display + SF Pro Text + SF Mono',
    l1:'SF Pro Display sets the title, SF Pro Text runs the labels and captions, SF Mono holds the live numbers.',
    l2:'<b>Ships with macOS.</b> Nothing to bundle, nothing to license. It is also what every other Mac app looks like.' },
  { cls:'fp2', name:'SF Pro Rounded + SF Pro Text + SF Mono', rec:true, probe:'rounded',
    l1:'SF Pro Rounded softens the title and the Feel presets. SF Pro Text keeps labels and captions, SF Mono holds the numbers.',
    l2:'<b>Ships with macOS.</b> In SwiftUI it is one line, <code>.fontDesign(.rounded)</code>, with no bundled file.' },
  { cls:'fp3', name:'Geist + Geist + Geist Mono', probe:'Geist',
    l1:'One family for everything: Geist on the title, labels and captions, Geist Mono on the live numbers.',
    l2:'<b>Needs bundling.</b> Two font files shipped inside the app. Open Font License, free for commercial use.' },
  { cls:'fp4', name:'Inter Tight + Inter + JetBrains Mono', probe:'Inter Tight',
    l1:'Inter Tight pulls the title in, Inter runs the labels and captions, JetBrains Mono holds the numbers.',
    l2:'<b>Needs bundling.</b> Three font files inside the app. All Open Font License.' },
  { cls:'fp5', name:'Space Grotesk + SF Pro Text + Space Mono', probe:'Space Grotesk',
    l1:'Space Grotesk gives the title its character, the system font keeps labels and captions calm, Space Mono holds the numbers.',
    l2:'<b>Needs bundling.</b> Two font files inside the app; the rest of the interface stays on macOS type.' },
  { cls:'fp6', name:'New York + SF Pro Text + SF Mono', probe:'serif',
    l1:'New York, the macOS system serif, on the title only. SF Pro Text for labels and captions, SF Mono for the numbers.',
    l2:'<b>Ships with macOS.</b> In SwiftUI it is <code>.fontDesign(.serif)</code> on the title, nothing bundled.' }
];

document.getElementById('verdict-text').innerHTML =
  'Ship <b>SF Pro Rounded + SF Pro Text + SF Mono</b>: the rounded title and preset names give a party lights app the warmth it is asking for, while every face still comes free with macOS, so there is no font file to bundle and nothing to license.';

/* ---------------- the excerpt ---------------- */
function meterSegs(lit){
  let s='';
  for(let i=0;i<48;i++){ s += '<span class="meter-seg'+(lit && i>=43 ? ' pk':'')+'"></span>'; }
  return s;
}
function panel(){
  return `
  <div class="panel">
    <div class="hdr">
      <h3 class="title">Party Mode</h3>
      <span class="sp"></span>
      <label class="switch">
        <input type="checkbox" checked aria-label="Party Mode">
        <span class="track"><span class="knob"></span></span>
      </label>
    </div>

    <section class="hero">
      <div class="glass">
        <div class="hero-head">
          <h4 class="section-title">Trigger Level</h4>
          <span class="hero-value num">69%</span>
        </div>
        <div class="meter-block">
          <div class="meter-wrap">
            <div class="meter" role="meter" aria-label="Input level"
                 aria-valuemin="0" aria-valuemax="100" aria-valuenow="69">
              ${meterSegs(false)}
              <div class="meter-lit" aria-hidden="true">${meterSegs(true)}</div>
            </div>
            <div class="marker" style="left:69%" role="slider" tabindex="0"
                 aria-label="Trigger level" aria-valuemin="0" aria-valuemax="100"
                 aria-valuenow="69" aria-valuetext="69 percent"><span class="grip"></span></div>
          </div>
          <p class="caption" style="margin-top:16px">Lights kick in when the music is louder than the marker. Lower catches more, higher only the loud parts.</p>
        </div>
      </div>
    </section>

    <section class="section">
      <div class="section-head"><h4 class="section-title">Feel</h4></div>
      <div class="segmented" role="radiogroup" aria-label="Feel">
        <button class="seg" type="button" role="radio" aria-checked="true">Punchy</button>
        <button class="seg" type="button" role="radio" aria-checked="false">Mellow</button>
        <button class="seg" type="button" role="radio" aria-checked="false">Dreamy</button>
        <button class="seg" type="button" role="radio" aria-checked="false">Tight</button>
        <button class="seg" type="button" role="radio" aria-checked="false">Custom</button>
      </div>
      <p class="caption sub">Fast and bright.</p>
    </section>

    <section class="section">
      <div class="row">
        <span class="label">Snap</span>
        <div class="slider"><div class="strack">
          <div class="fill" style="width:62%"></div>
          <div class="thumb" style="--p:62" role="slider" tabindex="0"
               aria-label="Snap" aria-valuemin="0" aria-valuemax="100"
               aria-valuenow="62" aria-valuetext="0.05 seconds"></div>
        </div></div>
        <span class="value num">0.05<span class="unit">s</span></span>
      </div>
      <div class="row">
        <span class="label">Travel</span>
        <div class="slider"><div class="strack">
          <div class="fill" style="width:64.3%"></div>
          <div class="thumb" style="--p:64.3" role="slider" tabindex="0"
               aria-label="Travel" aria-valuemin="1" aria-valuemax="15"
               aria-valuenow="10" aria-valuetext="10 bulbs per second"></div>
        </div></div>
        <span class="value num">10<span class="unit">bulbs/s</span></span>
      </div>
    </section>
  </div>`;
}

/* ---------------- render ---------------- */
const grid = document.getElementById('grid');

function render(both){
  grid.classList.toggle('both', both);
  grid.innerHTML = PAIRINGS.map((p,i)=>{
    const stages = both
      ? `<div><p class="stage-cap">Dark</p><div class="${p.cls} t-dark">${panel()}</div></div>
         <div><p class="stage-cap">Light</p><div class="${p.cls} t-light">${panel()}</div></div>`
      : `<div class="${p.cls}">${panel()}</div>`;
    return `
    <article class="card">
      <header class="card-head">
        <h2 class="card-name">${p.name}</h2>
        <span class="sp"></span>
        ${p.rec ? '<span class="badge">Recommended</span>' : ''}
        <span class="idx">${i+1}</span>
      </header>
      <div class="stages">${stages}</div>
      <p class="note">${p.l1}</p>
      <p class="note">${p.l2} <span class="status" data-probe="${p.probe||''}"></span></p>
    </article>`;
  }).join('');
  checkFonts();
}

/* ---------------- is the font actually here? ---------------- */
const cvs = document.createElement('canvas').getContext('2d');
const SAMPLE = 'Party Mode Handgloves 0123';
function widthOf(stack){ cvs.font = '40px ' + stack; return cvs.measureText(SAMPLE).width; }

/* a family (or a ui-* generic) is only really present if it displaces every generic baseline */
function has(family){
  return ['monospace','serif','sans-serif'].some(base =>
    Math.abs(widthOf(family + ', ' + base) - widthOf(base)) > 0.5);
}

function checkFonts(){
  document.querySelectorAll('.status').forEach(el=>{
    const probe = el.dataset.probe;
    if(!probe) return;
    let ok = true, msg = '';

    if(probe === 'rounded'){
      if(has('"SF Pro Rounded"')){
        msg = 'SF Pro Rounded is installed on this Mac, so the title below is the real face.';
      } else if(has('ui-rounded')){
        ok = true;
        msg = 'Reached through ui-rounded, the macOS rounded face, so the title below is real.';
      } else {
        ok = false;
        msg = 'Not resolved in this browser, so the title below is plain SF. Safari and the SwiftUI app do show the rounded face.';
      }
    } else if(probe === 'serif'){
      if(has('ui-serif') || has('"New York"')){
        msg = 'New York is live in this browser.';
      } else if(has('Georgia')){
        ok = false;
        msg = 'This browser shows Georgia here; Safari and the SwiftUI app show New York.';
      } else {
        ok = false;
        msg = 'No serif resolved here, so the title below is plain SF.';
      }
    } else {
      ok = document.fonts.check('16px "' + probe + '"') && has('"' + probe + '"');
      msg = ok ? 'Web font loaded for this preview.'
               : 'Web font did not load, so the panel below is showing system type.';
    }

    el.textContent = msg;
    el.classList.toggle('warn', !ok);
  });
}

/* ---------------- theme ---------------- */
const mq = window.matchMedia('(prefers-color-scheme: dark)');
let mode = 'system';

function apply(){
  const resolved = mode === 'light' ? 'light'
                 : mode === 'dark'  ? 'dark'
                 : (mq.matches ? 'dark' : 'light');
  const root = document.documentElement;
  root.classList.toggle('t-dark', resolved === 'dark');
  root.classList.toggle('t-light', resolved === 'light');
  document.querySelectorAll('#modes .mode').forEach(b=>{
    b.setAttribute('aria-pressed', String(b.dataset.mode === mode));
  });
  render(mode === 'both');
}

document.getElementById('modes').addEventListener('click', e=>{
  const b = e.target.closest('.mode');
  if(!b) return;
  mode = b.dataset.mode;
  try{ localStorage.setItem('glowbeat-specimen-mode', mode); }catch(_){}
  apply();
});
mq.addEventListener('change', ()=>{ if(mode === 'system' || mode === 'both') apply(); });

try{
  const saved = localStorage.getItem('glowbeat-specimen-mode');
  if(saved) mode = saved;
}catch(_){}
const q = new URLSearchParams(location.search).get('mode');
if(q && ['dark','light','system','both'].includes(q)) mode = q;

apply();
if(document.fonts && document.fonts.ready){ document.fonts.ready.then(checkFonts); }
</script>
</body></html>
